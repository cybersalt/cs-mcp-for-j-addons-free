PLG_SYSTEM_CSMCPFORJCOMMUNITYBUILDER="System - MCP for Joomla: Community Builder add-on"
PLG_SYSTEM_CSMCPFORJCOMMUNITYBUILDER_XML_DESCRIPTION="MCP tools for Community Builder (com_comprofiler) by Joomlapolis: members and their CB profile fields, registration moderation (approve, reject, confirm, ban, block) with every CB email held back unless you ask for it, custom fields and their option lists, profile tabs, connections, user reports, lists and plugins, CB's configuration with a registration-email audit, health checks and a redacted table reader. Free, because Community Builder itself is free. Paid Joomlapolis add-ons (CB Paid Subscriptions, GroupJive and the rest) are not covered."
