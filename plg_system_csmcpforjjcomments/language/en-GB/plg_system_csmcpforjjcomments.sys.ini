PLG_SYSTEM_CSMCPFORJJCOMMENTS="System - MCP for JComments"
PLG_SYSTEM_CSMCPFORJJCOMMENTS_XML_DESCRIPTION="MCP tools for JComments (com_jcomments, the exstreme Jcomments-4 line): list and read comments with their threads, approve or unpublish them singly or in bulk, reply as the site's own account with correct threading, find likely spam with an explanation for every flag, and unpublish, delete or IP-ban it. Also a health check, a settings reader, and read-only views of subscriptions, the blacklist, user reports and the mail queue. Nothing emails anyone unless you ask. Free, because JComments is free."
