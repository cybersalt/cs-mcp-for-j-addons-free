PLG_SYSTEM_CSMCPFORJATSFREE="System - MCP for Joomla: Akeeba Ticket System add-on"
PLG_SYSTEM_CSMCPFORJATSFREE_XML_DESCRIPTION="MCP tools for Akeeba Ticket System (com_ats) by Akeeba Ltd. Covers the Core (free) edition's surface: tickets, posts, categories, invited collaborators, managers and reporting. Also runs against ATS Professional — it detects the edition via the vendor's own ATS_PRO constant and reports Pro-only capability as locked rather than reaching around it."
