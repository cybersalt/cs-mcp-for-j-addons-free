PLG_SYSTEM_CSMCPFORJCPNBFREE_XML_DESCRIPTION="MCP tools for Cookies Policy Notification Bar 5.x by Web357: the notification bar's position, behaviour, colours and buttons, its texts in the site's default language, cookie categories, the cookie declarations shown in the Cookies Manager, and diagnostics including a check of what the rendered front end actually serves. Free, and works with both the free and PRO editions of CPNB. Cookie blocking, consent logs, GeoIP targeting, texts in additional languages and settings import/export are CPNB PRO capabilities; their tools ship in the separate Pro add-on."
