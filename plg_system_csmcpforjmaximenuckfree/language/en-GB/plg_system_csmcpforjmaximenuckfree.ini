PLG_SYSTEM_CSMCPFORJMAXIMENUCKFREE="System - MCP for Maximenu CK"
PLG_SYSTEM_CSMCPFORJMAXIMENUCKFREE_XML_DESCRIPTION="Adds Maximenu CK tools to MCP for Joomla: modules, styles and their custom CSS (written to the style row the menu actually renders, with Maximenu's own baked copy kept in step), the compiled-CSS cache, the mega-menu column layout of each menu, and a panel-overflow check. Works with both Maximenu CK Light and Pro. Writing per-item mega-menu settings is a Maximenu CK Pro feature and ships in the separate Pro add-on. Requires MCP for Joomla."
