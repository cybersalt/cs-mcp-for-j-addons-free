PLG_SYSTEM_CSMCPFORJAKEEBABACKUP="System - MCP for Akeeba Backup"
PLG_SYSTEM_CSMCPFORJAKEEBABACKUP_XML_DESCRIPTION="Adds MCP tools for Akeeba Backup (Core or Pro, com_akeebabackup) to MCP for J: list and read backup profiles, list and inspect backup records, start and step backups, and delete backups or just their archives. Every tool applies Akeeba Backup's own permissions. Restore is not exposed: it runs through Akeeba's own restore tools."
