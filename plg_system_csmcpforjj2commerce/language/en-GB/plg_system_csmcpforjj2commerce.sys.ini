PLG_SYSTEM_CSMCPFORJJ2COMMERCE="System - MCP for J2Commerce"
PLG_SYSTEM_CSMCPFORJJ2COMMERCE_XML_DESCRIPTION="MCP tools for J2Commerce 6 (com_j2commerce) by J2Commerce, LLC: products and variants, prices, stock, orders and their status, customers, coupons, gift vouchers, store lookups, sales reporting and a set of diagnostics including a tax-setup audit. Free, because J2Commerce 6 has no Pro edition gate. Works with J2Commerce 6 only; J2Store 4 (com_j2store) is a different product."
