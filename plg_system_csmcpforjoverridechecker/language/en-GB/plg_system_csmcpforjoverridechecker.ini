PLG_SYSTEM_CSMCPFORJOVERRIDECHECKER="System - MCP for Override Checker"
PLG_SYSTEM_CSMCPFORJOVERRIDECHECKER_XML_DESCRIPTION="MCP tools for Cybersalt Override Checker (com_csoverridechecker), so any MCP client, browser chats included, can review and fix the template overrides Joomla flags after an update: list the flagged overrides, read the override and core files whole, apply a fix through Override Checker (which backs the file up first), dismiss one row at a time, list, read and restore backups, and save the review as an Override Checker session. Free, because Override Checker is free."
