PLG_SYSTEM_CSMCPFORJACYMAILINGFREE="System - MCP for AcyMailing"
PLG_SYSTEM_CSMCPFORJACYMAILINGFREE_XML_DESCRIPTION="MCP tools for AcyMailing by Acyba (com_acym) covering everything AcyMailing Starter can do, on every edition: lists, subscribers and subscriptions, campaign drafts, test sends, the sending queue, statistics, list-overlap and duplicate reports, configuration and diagnostics. Writes go through AcyMailing's own classes; every mail side effect (confirmation, welcome, unsubscribe and admin notification emails) is off unless asked for, and queueing a campaign needs a dry run, confirm and the expected recipient count. Essential and Enterprise capabilities are in the separate Pro add-on."
