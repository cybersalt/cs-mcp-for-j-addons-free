PLG_SYSTEM_CSMCPFORJGANTRY5="System - MCP for Gantry 5"
PLG_SYSTEM_CSMCPFORJGANTRY5_XML_DESCRIPTION="MCP tools for the Gantry 5 template framework: themes, outlines and their page assignments, layouts, particle settings per outline (instance settings and particle defaults), module positions and module instances per outline, Styles, Gantry 5 Particle modules, backups and cache clearing, with a health check that covers Joomla 6 support. Every value read says where it comes from (the outline, the Base Outline, the theme or the blueprint); every change is validated against the particle's blueprint and backed up first. Free, because Gantry 5 is free."
