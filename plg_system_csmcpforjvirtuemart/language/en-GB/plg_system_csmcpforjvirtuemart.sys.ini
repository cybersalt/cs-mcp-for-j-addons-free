PLG_SYSTEM_CSMCPFORJVIRTUEMART="System - MCP for Joomla - VirtueMart"
PLG_SYSTEM_CSMCPFORJVIRTUEMART_XML_DESCRIPTION="Exposes VirtueMart (com_virtuemart) to MCP for Joomla as 48 tools: products and their per-language rows, categories, manufacturers, prices, stock, orders, customers, shopper groups, reviews and a set of diagnostics. Every write is a read-modify-write of the whole record or a targeted single-column update, so a partial save can never trigger VirtueMart's destructive replace-set behaviour. Includes an audit for the invisible-product problem caused by missing language-table rows. Orders are read and status-change only; there are no media upload tools and no configuration setter, by design. VirtueMart is GPL with a single free edition, so there is no vendor gate to honour. Requires cs-mcp-for-j."
