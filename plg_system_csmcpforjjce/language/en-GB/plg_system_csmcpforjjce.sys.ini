PLG_SYSTEM_CSMCPFORJJCE="System - MCP for Joomla - JCE"
PLG_SYSTEM_CSMCPFORJJCE_XML_DESCRIPTION="Exposes JCE (Joomla Content Editor) to MCP for Joomla as 21 tools: editor profiles, their assignment to user groups, users, components, areas and devices, the toolbar layout, the per-plugin configuration blob, the merged plugin catalogue, a profile resolver that answers which profile a given user actually gets, and a read-only security audit for the CVE-2026-48907 rogue-profile indicators. Works with both the free and Pro editions and reports which one it found — there is no separate Pro add-on, because JCE Pro adds no table and no new stored entity. Writes hard-refuse executable upload extensions and refuse entirely below JCE 2.9.99.5. Requires cs-mcp-for-j."
